version: '3.8'

services:
  backend:
    build:
      context: ./paperguide-ai/backend
    container_name: paperguide-backend
    ports:
      - "8000:8000"
    env_file:
      - ./paperguide-ai/backend/.env
    volumes:
      - ./paperguide-ai/backend/storage:/app/storage
    environment:
      - ENV=development
      - DEBUG=True

  frontend:
    build:
      context: ./frontend
    container_name: paperguide-frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
