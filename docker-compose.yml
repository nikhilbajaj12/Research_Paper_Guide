version: '3.8'

services:
  backend:
    build:
      context: ./paperguide-ai/backend
      dockerfile: Containerfile
    container_name: paperguide-backend
    ports:
      - "8000:8000"
    env_file:
      - ./paperguide-ai/backend/.env
    volumes:
      - ./paperguide-ai/backend/storage:/app/storage
    environment:
      - ENV=development
      - DEBUG=True
    networks:
      - paperguide-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Containerfile
    container_name: paperguide-frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    depends_on:
      backend:
        condition: service_started
    networks:
      - paperguide-network
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://backend:8000

networks:
  paperguide-network:
    driver: bridge
