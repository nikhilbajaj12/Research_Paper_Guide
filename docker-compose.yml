version: '3.8'

services:
  backend:
    build:
      context: ./paperguide-ai/backend
      dockerfile: Containerfile
    container_name: paperguide-backend
    ports:
      - "8000:8000"
    env_file:
      - ./paperguide-ai/backend/.env
    volumes:
      - ./paperguide-ai/backend/storage:/app/storage
    environment:
      - ENV=development
      - DEBUG=True
    networks:
      - paperguide-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Containerfile
    container_name: paperguide-frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - paperguide-network
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://backend:8000

networks:
  paperguide-network:
    driver: bridge
